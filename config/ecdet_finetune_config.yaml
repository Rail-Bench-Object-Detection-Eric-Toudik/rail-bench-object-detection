# Training
epochs: 300
batch_size: 12
image_size: 1024
model: "MEDIUM" # ECDet size to use; options include "SMALL", "MEDIUM", "LARGE", "XLARGE"
seed: 42
num_workers: 8
num_classes: 7 # ['train', 'catenary_pole', 'signal_pole', 'signal', 'person', 'road_vehicle', 'bicycle']

# Learning Rates
lr_head: 0.0001 # initial learning rate for head
lr_backbone: 0.00001 # initial learning rate for backbone
weight_decay: 0.0001
warmup_steps: 500

# Freeze schedule
freeze_phase_1_epochs: 50
partial_unfreeze_until: 150
partial_unfreeze_last_n: 4

# Evaluation
eval_interval_epochs: 1

# Logging
use_wandb: True
wandb_project: "Rail-Bench-Object-Detection-Eric-Toudik"
log_interval: 50

# AMP and CUDA
no_amp: False
no_cuda: False
max_grad_norm: 1.0

