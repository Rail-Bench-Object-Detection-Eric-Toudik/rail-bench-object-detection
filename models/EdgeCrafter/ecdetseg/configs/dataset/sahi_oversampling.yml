task: detection

evaluator:
  type: CocoEvaluator
  iou_types: ['bbox']
  verbose: True

num_classes: 7 # your dataset classes
remap_mscoco_category: True

train_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetection
    img_folder: ../../../data/sahi/sliced_coco/train
    ann_file: ../../../data/sahi_oversampled/train/annotations_train_sahi_oversampled.json
    return_masks: False
    transforms:
      type: Compose
      ops: ~
  shuffle: True
  num_workers: 4
  drop_last: True
  collate_fn:
    type: BatchImageCollateFunction


val_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetection
    img_folder: ../../../data/sahi/sliced_coco/val
    ann_file: ../../../data/sahi/sliced_coco/val/val_sliced_coco.json
    return_masks: False
    transforms:
      type: Compose
      ops: ~
  shuffle: False
  num_workers: 4
  drop_last: False
  collate_fn:
    type: BatchImageCollateFunction
