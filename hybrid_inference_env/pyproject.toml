[project]
name = "rail-bench-hybrid-inference-env"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "calflops>=0.3.2",
    "numpy>=2.4.4",
    "pycocotools>=2.0.11",
    "pyyaml>=6.0.3",
    "sahi>=0.11.36",
    "scipy>=1.17.1",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "transformers[torch]>=5.9.0",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
    { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

