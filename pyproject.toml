[project]
name = "rail-bench-object-detection"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "albumentations>=2.0.8",
    "calflops>=0.3.2",
    "ipykernel>=7.2.0",
    "lightly-train>=0.15.1",
    "matplotlib>=3.10.8",
    "ml-dtypes>=0.5.4",
    "numpy>=2.4.4",
    "onnx>=1.21.0",
    "onnxruntime>=1.26.0",
    "opencv-python>=4.11.0.86",
    "pandas>=3.0.2",
    "pycocotools>=2.0.11",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "sahi>=0.11.36",
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
    "tabulate>=0.10.0",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "transformers[torch]>=5.9.0",
    "ultralytics>=8.4.42",
    "wandb>=0.26.1",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
    { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
